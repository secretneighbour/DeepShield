<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Protective Shield -->
  <path d="M32 4 L54 13 C54 36 44 52 32 60 C20 52 10 36 10 13 Z" 
        fill="url(#shieldBg)" 
        stroke="url(#shieldBorder)" 
        stroke-width="2.5" 
        stroke-linejoin="round" />

  <!-- Inner Deep Shield Layer ("See Beyond the Surface") -->
  <path d="M32 12 L46 18 C46 34 39 45 32 51 C25 45 18 34 18 18 Z" 
        fill="none" 
        stroke="#38bdf8" 
        stroke-opacity="0.3" 
        stroke-width="1.5" 
        stroke-dasharray="3 2" />

  <!-- Central Laser Iris / Core Aperture -->
  <circle cx="32" cy="30" r="10" 
          fill="#030712" 
          stroke="url(#coreGlow)" 
          stroke-width="2" 
          filter="url(#glow)" />

  <!-- Inner Glowing Pupil / Optical Radar -->
  <circle cx="32" cy="30" r="4.5" fill="#38bdf8" />
  
  <!-- Optical Radar Horizon Bar -->
  <path d="M22 30 L42 30" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <path d="M32 20 L32 40" stroke="#a855f7" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
</svg>